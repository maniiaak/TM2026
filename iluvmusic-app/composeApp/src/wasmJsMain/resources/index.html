<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IluvMusic</title>
    <style>
        body { margin: 0; padding: 0; }
        #composeApp { width: 100vw; height: 100vh; }
        #composeApp canvas { touch-action: none; }
    </style>
</head>
<body>
<div id="composeApp"></div>
<script src="/firebase-config.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const app = initializeApp(window.__FIREBASE_CONFIG__);
    window.__FIREBASE_AUTH__ = getAuth(app);
    window.firebaseAuthModule = {
      createUserWithEmailAndPassword: (auth, email, password) =>
        createUserWithEmailAndPassword(auth, email, password)
          .catch(err => {
            console.error("FIREBASE createUser ERROR:", err.code, err.message);
            throw err;
          }),
      signInWithEmailAndPassword: (auth, email, password) =>
        signInWithEmailAndPassword(auth, email, password)
          .catch(err => {
            console.error("FIREBASE signIn ERROR:", err.code, err.message);
            throw err;
          })
    };
</script>
<script type="module" src="/composeApp.js"></script>
</body>
</html>
